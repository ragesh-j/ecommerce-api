services:
  api:
    build: .
    init: true                      # lets "docker compose stop" shut Node down cleanly
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Overrides the localhost value from .env: inside Docker, Mongo's hostname is "mongo"
      MONGO_URI: mongodb://mongo:27017/ecommerce
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db         # keeps your data when the container is removed
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data: